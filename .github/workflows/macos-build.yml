name: MacOS build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3
      uses: actions/setup-python@v7
      with:
        python-version: "3.14"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Setup Node.js environment
      uses: actions/setup-node@v7
    - name: Run build
      run: |
        chmod +x build-*.sh
        ./build-unix-freeze.sh mac
        chmod +x ./build/CodeBeagle/CodeBeagle
        chmod +x ./build/CodeBeagle/UpdateIndex
    - name: Run mypy
      run: |
        # stop the build if there are Python syntax errors or undefined names
        mypy
    - name: Read version number
      id: get_version
      run: echo "version=$(node -p "JSON.parse(fs.readFileSync('./VERSION', 'utf8')).local")" >> $GITHUB_OUTPUT
    - name: MacOS build result
      uses: actions/upload-artifact@v7
      with:
        name: CodeBeagle.MacOS.${{ steps.get_version.outputs.version }}
        path: build/CodeBeagle
    - name: Package macOS zip
      if: startsWith(github.ref, 'refs/tags/')
      run: zip -r CodeBeagle.MacOS.${{ steps.get_version.outputs.version }}.zip build/CodeBeagle
    - name: Attach to release
      if: startsWith(github.ref, 'refs/tags/')
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        asset="CodeBeagle.MacOS.${{ steps.get_version.outputs.version }}.zip"

        # Use the matching section from CHANGES as the release body, falling back
        # to auto-generated notes when there is no entry for this version.
        notes_args=(--generate-notes)
        section=$(python tools/ReleaseNotes.py "${GITHUB_REF_NAME#v}" CHANGES)
        if [ -n "$section" ]; then
          printf '%s\n' "$section" > release-notes.md
          notes_args=(--notes-file release-notes.md)
        fi

        # The three platform jobs run in parallel and may race to create the release.
        for attempt in 1 2 3 4 5; do
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && break
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" "${notes_args[@]}" --verify-tag && break
          sleep 5
        done
        gh release upload "$GITHUB_REF_NAME" "$asset" --clobber

