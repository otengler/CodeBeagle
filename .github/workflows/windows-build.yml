name: Windows build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3
      uses: actions/setup-python@v7
      with:
        python-version: "3.14"
    - name: Install dependencies
      run: |
        python.exe -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Setup Node.js environment
      uses: actions/setup-node@v7
    - name: Run build
      run: .\build-windows-freeze.ps1
    - name: Run mypy
      run: |
        # stop the build if there are Python syntax errors or undefined names
        mypy
    - name: Read version number
      id: get_version
      shell: bash
      run: echo "version=$(node -p "JSON.parse(fs.readFileSync('./VERSION', 'utf8')).local")" >> $GITHUB_OUTPUT
    - name: Windows build result
      uses: actions/upload-artifact@v7
      with:
        name: CodeBeagle.Windows.${{ steps.get_version.outputs.version }}
        path: build/CodeBeagle
    - name: Package Windows zip
      if: startsWith(github.ref, 'refs/tags/')
      shell: pwsh
      run: Compress-Archive -Path build/CodeBeagle -DestinationPath CodeBeagle.Windows.${{ steps.get_version.outputs.version }}.zip
    - name: Attach to release
      if: startsWith(github.ref, 'refs/tags/')
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        asset="CodeBeagle.Windows.${{ steps.get_version.outputs.version }}.zip"

        # The three platform jobs run in parallel and may race to create the release.
        for attempt in 1 2 3 4 5; do
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && break
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag && break
          sleep 5
        done
        gh release upload "$GITHUB_REF_NAME" "$asset" --clobber

